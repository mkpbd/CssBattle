<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100vw;
            display: grid;
            grid-template-columns: repeat(12, minmax(71px, 1fr));
            grid-template-rows: repeat(12, minmax(100px, 1fr));
            grid-gap: 10px;
            justify-content: space-between;
        }
        .item{
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .item-1 {
            grid-column: 1 / span 4;
            grid-row: 1 / span 3;
        }
        .item-2 {
            grid-column: 5 / span 2;
            grid-row: 1 / span 5;
        }
        .item-3 {
            grid-column: 7 / span 1;
            grid-row: 1 / span 2;
        }
        .item-4 {
            grid-column: 8 / span 11;
            grid-row: 1 / span 1;
        }
        .item-5 {
            grid-column: 1 / span 2;
            grid-row: 4 / span 2;
        }
        .item-6 {
            grid-column: 3 / span 2;
            grid-row: 4 / span 1;
        }
        .item-7 {
            grid-column: 3 / span 2;
            grid-row: 4 / span 1;
        }

        .item-8 {
            grid-column: 3 / span 2;
            grid-row: 5 / span 1;
        }
        .item-9 {
            grid-column: 7/ span 2;
            grid-row: 2 / span 4;
        }
        .item-10 {
            grid-column: 9 / span 10;
            grid-row: 2 / span 6;
        }
        .item-11 {
            grid-column: 1 / span 8;
            grid-row: 6 / span 2;
        }
        .item-12 {
            grid-column: 1 / span 10;
            grid-row: 8 / span 2;
        }
        .item-13 {
            grid-column: 11 / span 8;
            grid-row: 8 / span 2;
        }
        .item-14 {
            grid-column: 1 / span 18;
            grid-row: 10 / span 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">item-1</div>
        <div class="item item-2">item-2</div>
        <div class="item item-3">item-3</div>
        <div class="item item-4">item-4</div>
        <div class="item item-5">item-5</div>
        <div class="item item-6">item-6</div>
        <div class="item item-7">item-7</div>
        <div class="item item-8">item-8</div>
        <div class="item item-9">item-9</div>
        <div class="item item-10">item-10</div>
        <div class="item item-11">item-11</div>
        <div class="item item-12">item-12</div>
         <div class="item item-13">item-13</div>
          <div class="item item-14">item-14</div>
    </div>

</body>
</html>
